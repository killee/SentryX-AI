substitutions:
  devicename: sentryx-ai
  friendly_name: "SentryX AI"
  device_name_suffix: "SentryX AI"
  entity_suffix: ${device_name_suffix}
  

esphome:
  name: ${devicename}
  comment: "SentryX AI door access, presence and greeting system"
  on_boot:
    priority: -10
    then:
      - micro_wake_word.start:

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${devicename} Hotspot
    password: !secret wifi_password

captive_portal:

logger:
  level: DEBUG
#  baud_rate: 0        # no serial output -> UART0 free

ota:
  password: !secret esp_password
  platform: esphome

psram:
  mode: octal
  speed: 80MHz

# external_components:
#   - source: github://pr#12195
#     components: [hlk_fm22x]
#     refresh: 1h

packages:
  display: !include common/display.yaml
  radar: !include common/radar_ld2410.yaml
  fm22x: !include common/fm22x.yaml
  audio_i2s: !include common/audio_i2s.yaml

api:
  encryption:
    key: !secret api_key

  actions:
    - action: enroll
      variables:
        name: string
        direction: int
      then:
        - hlk_fm22x.enroll:
            name: !lambda 'return name;'
            direction: !lambda 'return direction;'
    - action: scan
      then:
        - hlk_fm22x.scan:
    - action: delete
      variables:
        face_id: int
      then:
        - hlk_fm22x.delete:
            face_id: !lambda 'return face_id;'
    - action: delete_all
      then:
        - hlk_fm22x.delete_all:
    - action: reset
      then:
        - hlk_fm22x.reset:
    # Reset enrollment status before "full enroll"
    - action: reset_enroll_status
      then:
        - lambda: |-
            id(enroll_any_failed) = false;
    # Show enrollment result on the matrix (green/red smiley)
    - action: show_enroll_result
      then:
        - lambda: |-
            ESP_LOGI("fm22x", "show_enroll_result called, enroll_any_failed=%s",
                     id(enroll_any_failed) ? "true" : "false");

            if (id(enroll_any_failed)) {
              id(matrix_mode).publish_state("Smiley Sad");
              auto call = id(led_matrix).turn_on();
              call.set_rgb(1.0f, 0.0f, 0.0f);  // red
              call.perform();
            } else {
              id(matrix_mode).publish_state("Smiley Happy");
              auto call = id(led_matrix).turn_on();
              call.set_rgb(0.0f, 1.0f, 0.0f);  // green
              call.perform();
            }

globals:
  # Lock while greeting is shown -> radar must not overwrite the display
  - id: matrix_locked
    type: bool
    restore_value: no
    initial_value: 'false'

  # Display state of the matrix:
  # 0 = Blank / Off
  # 1 = Pulse (person < 4 m)
  # 2 = Happy (person very close)
  # 3 = Greeting ("Hi Name")
  # 4 = Sad (unknown face)
  - id: display_state
    type: int
    restore_value: no
    initial_value: '0'

  - id: enroll_any_failed
    type: bool
    restore_value: no
    initial_value: 'false'

  # Tracks whether the door latch is permanently open
  # -> must not be overridden by short door openings
  - id: door_latch_permanent
    type: bool
    restore_value: yes
    initial_value: 'false'

# --------------------------------------------------------
#  Door relay + global switches
# --------------------------------------------------------
switch:
  # Door latch relay (engage)
  - platform: gpio
    id: druecker
    name: "Door Latch Relay ${entity_suffix}"
    icon: "mdi:door-open"
    pin:
      number: GPIO5
      inverted: true
    restore_mode: ALWAYS_OFF

  # Door permanently open
  - platform: template
    name: "Door Latch Permanent ${entity_suffix}"
    id: door_latch_permanent_switch
    icon: "mdi:door-open"
    optimistic: true
    turn_on_action:
      - lambda: |-
          id(door_latch_permanent) = true;
      - switch.turn_on: druecker
      - lambda: |-
          // Matrix: door permanently open -> show door icon in green
          id(matrix_mode).publish_state("Door");
          auto call = id(led_matrix).turn_on();
          call.set_rgb(0.0f, 1.0f, 0.0f);  // green
          call.perform();
    turn_off_action:
      - lambda: |-
          id(door_latch_permanent) = false;
      - switch.turn_off: druecker
      - script.execute: matrix_set_blank

  # Global radar (LD2410) enable switch
  - platform: template
    name: "Radar Enabled ${entity_suffix}"
    id: ld2410_enabled
    icon: "mdi:radar"
    optimistic: true

