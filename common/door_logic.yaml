script:
  # Greeting "Hi <Name>" für 20s
  - id: matrix_show_greeting
    mode: restart
    parameters:
      name: string
    then:
      - lambda: |-
          id(matrix_locked) = true;
          id(display_state) = 3;
          std::string msg = "Hi " + name;
          if (msg.length() > 16) {
            msg = msg.substr(0, 16);
          }
          id(matrix_text).publish_state(msg);
          id(matrix_mode).publish_state("Text");
          auto call = id(led_matrix).turn_on();
          call.set_rgb(0.0f, 1.0f, 0.0f);
          call.perform();
      - delay: 20s
      - script.execute: matrix_set_blank

  # Zustand 0: Blank
  - id: matrix_set_blank
    mode: restart
    then:
      - lambda: |-
          if (id(door_latch_permanent)) {
            return;
          }
          id(display_state) = 0;
          id(matrix_locked) = false;
          id(matrix_mode).publish_state("Blank");
          auto call = id(led_matrix).turn_off();
          call.perform();

  # Zustand 1: Pulse
  - id: matrix_set_pulse
    mode: restart
    then:
      - lambda: |-
          if (id(door_latch_permanent)) {
            return;
          }
          id(display_state) = 1;
          id(matrix_mode).publish_state("Pulse");
          auto call = id(led_matrix).turn_on();
          call.set_rgb(0.0f, 0.0f, 1.0f);
          call.perform();

  # Zustand 2: Happy
  - id: matrix_set_happy
    mode: restart
    then:
      - lambda: |-
          if (id(door_latch_permanent)) {
            return;
          }
          id(display_state) = 2;
          id(matrix_mode).publish_state("Smiley Happy");
          auto call = id(led_matrix).turn_on();
          call.set_rgb(0.0f, 1.0f, 0.0f);
          call.perform();

  # Zustand 4: Sad
  - id: matrix_set_sad
    mode: restart
    then:
      - lambda: |-
          if (id(door_latch_permanent)) {
            return;
          }
          id(matrix_locked) = true;
          id(display_state) = 4;
          id(matrix_mode).publish_state("Smiley Sad");
          auto call = id(led_matrix).turn_on();
          call.set_rgb(1.0f, 0.0f, 0.0f);
          call.perform();
      - delay: 5s
      - script.execute: matrix_set_blank

switch:
  - platform: template
    name: "FM22x Dauer-Scan"
    id: fm22x_continuous_scan
    icon: "mdi:motion-sensor"
    optimistic: true

  - platform: gpio
    id: druecker
    name: "Türdrücker Relais"
    icon: "mdi:door-open"
    pin:
      number: GPIO5
      inverted: true
    restore_mode: ALWAYS_OFF

  - platform: template
    name: "Türdauer-Auf"
    id: door_latch_permanent_switch
    icon: "mdi:door-open"
    optimistic: true
    turn_on_action:
      - lambda: |-
          id(door_latch_permanent) = true;
      - switch.turn_on: druecker
      - lambda: |-
          id(matrix_mode).publish_state("Tuer");
          auto call = id(led_matrix).turn_on();
          call.set_rgb(0.0f, 1.0f, 0.0f);
          call.perform();
    turn_off_action:
      - lambda: |-
          id(door_latch_permanent) = false;
      - switch.turn_off: druecker
      - script.execute: matrix_set_blank

  - platform: template
    name: "LD2410 Radar aktiv"
    id: ld2410_enabled
    icon: "mdi:radar"
    optimistic: true

  # Optional: LD2410 Extras
  - platform: ld2410
    engineering_mode:
      name: "LD2410 Engineering Mode"
    bluetooth:
      name: "LD2410 Bluetooth"

binary_sensor:
  - platform: ld2410
    has_target:
      name: "LD2410 Presence"
      device_class: occupancy

interval:
  - interval: 350ms
    then:
      - if:
          condition:
            switch.is_on: fm22x_continuous_scan
          then:
            - hlk_fm22x.scan:
