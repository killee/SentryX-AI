text:
  - platform: template
    id: matrix_text
    name: "LED Matrix Text"
    mode: text
    optimistic: true
    min_length: 0
    max_length: 64

select:
  - platform: template
    id: matrix_mode
    name: "LED Matrix Mode"
    optimistic: true
    options:
      - Text
      - Arrow Up
      - Arrow Down
      - Arrow Left
      - Arrow Right
      - Smiley Happy
      - Smiley Sad
      - Smiley Wink
      - Smiley Wow
      - Center Dot
      - Sand Uhr
      - Tuer
      - House
      - X
      - Big DOT
      - Pulse
      - Blank
    initial_option: Text

light:
  - platform: esp32_rmt_led_strip
    id: led_matrix
    name: "LED Matrix"
    chipset: WS2812
    pin: GPIO2
    num_leds: 64
    rgb_order: GRB
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 0s
    gamma_correct: 1.5
    icon: "mdi:dots-grid"

display:
  - platform: addressable_light
    id: led_matrix_display
    addressable_light_id: led_matrix
    width: 8
    height: 8
    rotation: 270

    pixel_mapper: |-
      if (y % 2 == 0) {
        return y * 8 + (7 - x);
      } else {
        return y * 8 + x;
      }

    lambda: |-
      // ...hier deine bestehende, funktionierende Lambda
      // (Scrolltext, Pfeile, Smileys, Sand Uhr, Tuer, House, X, Big DOT, Pulse, Blank)...

script:
  # Greeting "Hi <Name>" für 20s
  - id: matrix_show_greeting
    mode: restart
    parameters:
      name: string
    then:
      - lambda: |-
          id(matrix_locked) = true;
          id(display_state) = 3;
          std::string msg = "Hi " + name;
          if (msg.length() > 16) {
            msg = msg.substr(0, 16);
          }
          id(matrix_text).publish_state(msg);
          id(matrix_mode).publish_state("Text");
          auto call = id(led_matrix).turn_on();
          call.set_rgb(0.0f, 1.0f, 0.0f);
          call.perform();
      - delay: 20s
      - script.execute: matrix_set_blank

  # Zustand 0: Blank
  - id: matrix_set_blank
    mode: restart
    then:
      - lambda: |-
          if (id(door_latch_permanent)) {
            return;
          }
          id(display_state) = 0;
          id(matrix_locked) = false;
          id(matrix_mode).publish_state("Blank");
          auto call = id(led_matrix).turn_off();
          call.perform();

  # Zustand 1: Pulse
  - id: matrix_set_pulse
    mode: restart
    then:
      - lambda: |-
          if (id(door_latch_permanent)) {
            return;
          }
          id(display_state) = 1;
          id(matrix_mode).publish_state("Pulse");
          auto call = id(led_matrix).turn_on();
          call.set_rgb(0.0f, 0.0f, 1.0f);
          call.perform();

  # Zustand 2: Happy
  - id: matrix_set_happy
    mode: restart
    then:
      - lambda: |-
          if (id(door_latch_permanent)) {
            return;
          }
          id(display_state) = 2;
          id(matrix_mode).publish_state("Smiley Happy");
          auto call = id(led_matrix).turn_on();
          call.set_rgb(0.0f, 1.0f, 0.0f);
          call.perform();

  # Zustand 4: Sad
  - id: matrix_set_sad
    mode: restart
    then:
      - lambda: |-
          if (id(door_latch_permanent)) {
            return;
          }
          id(matrix_locked) = true;
          id(display_state) = 4;
          id(matrix_mode).publish_state("Smiley Sad");
          auto call = id(led_matrix).turn_on();
          call.set_rgb(1.0f, 0.0f, 0.0f);
          call.perform();
      - delay: 5s
      - script.execute: matrix_set_blank
