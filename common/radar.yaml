ld2410:
  uart_id: uart_ld2410

sensor:
  - platform: ld2410
    moving_distance:
      name: "LD2410 Moving Distance"
    still_distance:
      name: "LD2410 Still Distance"
    detection_distance:
      name: "LD2410 Detection Distance"
      id: ld2410_detection_distance
      on_value:
        then:
          - lambda: |-
              // Wenn Türdauer-Auf aktiv → Anzeige nicht durch Radar ändern
              if (id(door_latch_permanent)) {
                return;
              }

              // Wenn Radar deaktiviert oder Greeting läuft → nix tun
              if (!id(ld2410_enabled).state) {
                return;
              }
              if (id(matrix_locked)) {
                return;
              }

              int new_state = id(display_state);

              if (x > 0 && x <= 35) {
                new_state = 2;   // Happy + Scan
              } else if (x > 35 && x <= 400) {
                new_state = 1;   // Pulse
              } else {
                new_state = 0;   // Blank
              }

              if (new_state == id(display_state)) {
                return;
              }

              id(display_state) = new_state;

              if (new_state == 2) {
                id(matrix_set_happy).execute();
                id(trigger_face_scan_from_ld2410).execute();
              } else if (new_state == 1) {
                id(matrix_set_pulse).execute();
              } else {
                id(matrix_set_blank).execute();
              }

switch:
  # Radar aktiv / inaktiv
  - platform: template
    name: "LD2410 Radar aktiv"
    id: ld2410_enabled
    icon: "mdi:radar"
    optimistic: true

  # Optional: LD2410 Extras
  - platform: ld2410
    engineering_mode:
      name: "LD2410 Engineering Mode"
    bluetooth:
      name: "LD2410 Bluetooth"

binary_sensor:
  - platform: ld2410
    has_target:
      name: "LD2410 Presence"
      device_class: occupancy

interval:
  - interval: 350ms
    then:
      - if:
          condition:
            switch.is_on: fm22x_continuous_scan
          then:
            - hlk_fm22x.scan:
